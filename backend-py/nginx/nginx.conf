# nginx.conf — 反向代理 + HTTPS + 静态资源缓存
# 架构：用户 → Nginx(80/443) → Uvicorn(8000)

# ---- 工作进程配置 ----
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # ---- 基础配置 ----
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # 日志格式：记录请求时间、IP、方法、URL、状态码、耗时
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ---- Gzip 压缩（减少传输体积，提速 60-80%）----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ---- 安全响应头 ----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- 请求体大小限制（文件上传需要）----
    client_max_body_size 10M;

    # ---- HTTP → HTTPS 自动跳转 ----
    server {
        listen 80;
        server_name localhost;

        # Let's Encrypt 验证路径（生产环境用）
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # 其他所有请求跳转到 HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---- HTTPS 主服务 ----
    server {
        listen 443 ssl;
        server_name localhost;

        # SSL 证书（自签名 / Let's Encrypt）
        ssl_certificate     /etc/nginx/ssl/news.crt;
        ssl_certificate_key /etc/nginx/ssl/news.key;

        # SSL 安全配置：只用 TLS 1.2+，禁用弱加密
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # ---- 反向代理到 FastAPI ----
        location /api/ {
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket 支持（如果需要）
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # 超时设置
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ---- Swagger 文档也代理 ----
        location /docs {
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /redoc {
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /openapi.json {
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ---- 上传文件静态服务 ----
        location /uploads/ {
            alias /app/uploads/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ---- 健康检查（不跳转 HTTPS，直接返回）----
        location = /nginx-health {
            return 200 "ok";
            add_header Content-Type text/plain;
        }
    }
}
